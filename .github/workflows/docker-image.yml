name: Docker Hub Images

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  docker:
    name: Build and publish Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image names
        id: image
        shell: bash
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          if [ -z "$DOCKERHUB_IMAGE" ]; then
            echo "::error::Set the GitHub repository variable DOCKERHUB_IMAGE, for example: your-dockerhub-name/kura"
            exit 1
          fi

          image_name="${DOCKERHUB_IMAGE,,}"
          image_name="${image_name#docker.io/}"
          echo "web=${image_name}" >> "$GITHUB_OUTPUT"
          echo "worker=${image_name}-worker" >> "$GITHUB_OUTPUT"

      - name: Generate date tag
        id: tag
        shell: bash
        run: echo "date=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.web }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=raw,value=${{ steps.tag.outputs.date }}

      - name: Extract worker image metadata
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.worker }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=raw,value=${{ steps.tag.outputs.date }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=kura-web
          cache-to: type=gha,mode=max,scope=kura-web

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=kura-worker
          cache-to: type=gha,mode=max,scope=kura-worker
