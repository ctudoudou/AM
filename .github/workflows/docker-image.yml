name: Docker Hub Images

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            target: runner
            cache-scope: kura-web
          - name: worker
            target: worker
            cache-scope: kura-worker
          - name: migrator
            target: migrator
            cache-scope: kura-migrator
          - name: mdns
            target: mdns
            cache-scope: kura-mdns

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize image names
        id: image
        shell: bash
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          if [ -z "$DOCKERHUB_IMAGE" ]; then
            echo "::error::Set the GitHub repository variable DOCKERHUB_IMAGE, for example: your-dockerhub-name/kura"
            exit 1
          fi

          image_name="${DOCKERHUB_IMAGE,,}"
          image_name="${image_name#docker.io/}"
          echo "web=${image_name}" >> "$GITHUB_OUTPUT"
          echo "worker=${image_name}-worker" >> "$GITHUB_OUTPUT"
          echo "migrator=${image_name}-migrator" >> "$GITHUB_OUTPUT"
          echo "mdns=${image_name}-mdns" >> "$GITHUB_OUTPUT"

      - name: Select image
        id: selected-image
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            web)
              echo "name=${{ steps.image.outputs.web }}" >> "$GITHUB_OUTPUT"
              ;;
            worker)
              echo "name=${{ steps.image.outputs.worker }}" >> "$GITHUB_OUTPUT"
              ;;
            migrator)
              echo "name=${{ steps.image.outputs.migrator }}" >> "$GITHUB_OUTPUT"
              ;;
            mdns)
              echo "name=${{ steps.image.outputs.mdns }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown image matrix entry: ${{ matrix.name }}"
              exit 1
              ;;
          esac

      - name: Generate date tag
        id: tag
        shell: bash
        run: echo "date=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.selected-image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}
            type=raw,value=${{ steps.tag.outputs.date }},enable=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
